{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body style="background-image:url('https://directoriopuertovallarta.com/wp-content/uploads/cache/images/cinepolislogo/cinepolislogo-4266502850.jpg')">

<div class="container mt-4">

    <div class="row mb-4 card">
        <div class="col-12 text-center">
            <br>
            <h1 style="font-family: fantasy">Cinepolis</h1>
            <br>
        </div>
    </div>

    <div class="row mb-2">
        <div class="col-12">
            <div class="card">

                <div class="card-header text-center">
                    <h3><b>Entradas</b></h3>
                </div>

                <div class="card-body">

                    <form action="/entradas" method="POST">

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <label>Nombre:</label>
                        <input type="text" name="nombre" class="form-control"><br>

                        <label>Cantidad de compradores:</label>
                        <input type="number" name="compradores" class="form-control"><br>

                        <label>Tarjeta Cineco:</label><br>
                        <label>Si</label>
                        <input type="radio" value="1" name="cineco">

                        <label>No</label>
                        <input type="radio" value="0" name="cineco"><br><br>

                        <label>Cantidad de boletos:</label>
                        <input type="number" name="boletos" class="form-control"><br>

                        <input type="submit" class="btn btn-primary" value="Pagar">

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<div style="clear: both; margin-top: 20px;">
    <h1><b>Valor a pagar: {{ resultado }}</b></h1>
</div>

</body>
{% endblock %}
